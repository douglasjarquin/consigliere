name: Deploy docs site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Configure GitHub Pages to use GitHub Actions in the repository Pages settings before deployment.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v2
      - name: Install Astro dependencies
        run: mise run web:install
      - name: Build
        run: mise run web:build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
