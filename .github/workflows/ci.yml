name: CI

on:
  push:
    branches: [main, rewrite-in-elixer]
  pull_request:

# Least privilege: CI only reads the checkout. No job writes to the repo.
permissions:
  contents: read

# Cancel superseded runs for the same branch or PR so only the newest commit's
# checks keep running.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which lanes this change can actually affect. bin/cs-ci-lanes.sh is the
  # single owner of the path-to-lane map, and of the fail-open rule when the change
  # set cannot be determined, so the mapping is one testable script rather than
  # `paths:` globs duplicated per job here.
  #
  # The gate is a job-level `if:`, never a workflow- or job-level `paths:` filter:
  # a filtered-out workflow never reports its checks at all, while a skipped job
  # still reports, so a check can never hang pending forever.
  changes:
    name: Changed lanes
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.lanes.outputs.lint }}
      coverage: ${{ steps.lanes.outputs.coverage }}
      portable: ${{ steps.lanes.outputs.portable }}
      herdr: ${{ steps.lanes.outputs.herdr }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Both endpoints of the comparison must be present in the clone.
          fetch-depth: 0
      - name: Decide the lanes this change needs
        id: lanes
        # The refs arrive as env values, never interpolated into the script body.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = pull_request ]; then
            base=$PR_BASE_SHA
            head=$PR_HEAD_SHA
          else
            base=$PUSH_BEFORE
            head=$PUSH_AFTER
          fi
          bin/cs-ci-lanes.sh "$base" "$head" | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Shell lint
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/cs-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Single owner of the lint definition (file set + config + version). Do not
      # re-spell the shellcheck command here; keep CI and local on this script.
      - run: bin/cs-lint.sh

  # Prove that portable + real-herdr + live-codex partition tests/*.test.sh with
  # no missing, no duplicate, and live-codex visibly excluded from hosted CI.
  test-coverage:
    name: Test coverage guard
    needs: changes
    if: needs.changes.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bin/cs-test-run.sh --check-coverage

  portable:
    name: Portable behavior
    needs: changes
    if: needs.changes.outputs.portable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Require test tools
        run: |
          set -eu
          command -v jq >/dev/null || { echo "::error::jq is required"; exit 1; }
          command -v python3 >/dev/null || { echo "::error::python3 is required"; exit 1; }
          jq --version
          python3 --version
      - name: Install tasks-axi
        # cs-decision-hold.sh's completion gate (exercised by cs-teardown and
        # cs-decision-hold) probes a compatible tasks-axi; install it so those
        # tests run for real instead of skipping or failing on its absence.
        run: |
          set -eu
          npm install -g tasks-axi
          tasks-axi --version
      - name: Run every portable (hermetic) test, serial
        run: bin/cs-test-run.sh --portable

  # Required real-Herdr lane: pinned install, protocol-floor assert, an isolated
  # cs-lab-* session only, hard-fail if the env-gate causes a skip instead of a
  # real run, and always clean up job-owned lab sessions.
  herdr:
    name: Real Herdr behavior
    needs: changes
    if: needs.changes.outputs.herdr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Require tools for real Herdr
        run: |
          set -eu
          command -v jq >/dev/null || { echo "::error::jq is required"; exit 1; }
          command -v curl >/dev/null || { echo "::error::curl is required"; exit 1; }
          command -v tar >/dev/null || { echo "::error::tar is required"; exit 1; }
          jq --version
      - name: Install pinned Herdr
        run: |
          set -eu
          bin/cs-install-herdr.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Assert Herdr pin and protocol floor
        run: |
          set -eu
          command -v herdr >/dev/null || { echo "::error::herdr not on PATH after install"; exit 1; }
          herdr --version
          floor=$(awk -F= '/^CS_HERDR_MIN_PROTOCOL=/ { gsub(/[^0-9]/, "", $2); print $2; exit }' bin/cs-herdr-lib.sh)
          status=$(herdr status --json)
          printf '%s\n' "$status"
          version=$(printf '%s' "$status" | jq -r '.client.version // empty')
          protocol=$(printf '%s' "$status" | jq -r '.client.protocol // empty')
          [ "$version" = "0.8.0" ] || { echo "::error::expected Herdr pin 0.8.0, got ${version:-<empty>}"; exit 1; }
          case "$protocol" in
            ''|*[!0-9]*) echo "::error::could not read client protocol"; exit 1 ;;
          esac
          [ "$protocol" -ge "$floor" ] || { echo "::error::herdr protocol $protocol below floor $floor"; exit 1; }
      - name: Start default Herdr session for the fleet-state tripwire
        run: |
          set -eu
          # cs-herdr-lab.sh provision requires exactly one running default session
          # so the default-session tripwire can arm. Start it headless; the suite
          # never uses it for lab work (it refuses default and uses cs-lab-* only).
          mkdir -p "$RUNNER_TEMP/cs-herdr"
          nohup herdr server >"$RUNNER_TEMP/cs-herdr/default-server.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/cs-herdr/default-server.pid"
          attempt=0
          while [ "$attempt" -lt 150 ]; do
            running=$(herdr status --json 2>/dev/null | jq -r '.server.running // false' || echo false)
            if [ "$running" = true ]; then
              herdr session list --json | jq -e '
                [.sessions[]? | select(.default == true and .name == "default" and .running == true)]
                | length == 1
              ' >/dev/null
              echo "default Herdr session is running"
              exit 0
            fi
            sleep 0.2
            attempt=$((attempt + 1))
          done
          echo "::error::default Herdr server did not become ready"
          cat "$RUNNER_TEMP/cs-herdr/default-server.log" || true
          exit 1
      - name: Snapshot pre-suite Herdr sessions
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/cs-herdr"
          bin/cs-herdr-ci-cleanup.sh snapshot "$RUNNER_TEMP/cs-herdr/sessions-before.json"
      - name: Run real-Herdr lane (serial, required)
        env:
          CS_TEST_HERDR_LIVE: "1"
        run: |
          set -eu
          # Fail if the env-gate causes a skip instead of a real run, so a broken
          # lane cannot pass as a false green. The live-codex opt-in env var is
          # never set anywhere in this workflow, so that suite never runs here.
          bin/cs-test-run.sh --herdr \
            --fail-on-gate-skip 'CS_TEST_HERDR_LIVE=1 to run'
      - name: Cleanup job-owned Herdr lab sessions
        if: always()
        run: |
          set -eu
          bin/cs-herdr-ci-cleanup.sh teardown "$RUNNER_TEMP/cs-herdr/sessions-before.json" || {
            echo "::warning::lab session cleanup reported a problem; see logs"
            herdr session list --json || true
            exit 1
          }

  daemon:
    name: Elixir daemon
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - uses: actions/setup-go@v5
        with:
          go-version-file: runner/cs-runner/go.mod
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: MIX_ENV=test mix test

  runner:
    name: Go runner
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner/cs-runner
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: runner/cs-runner/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race -shuffle=on -count=1 ./...
      - run: go build ./...

  cli:
    name: Go cs/csd client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race -shuffle=on -count=1 ./...
      - run: go build ./cmd/cs ./cmd/csd

  smoke:
    name: Release smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - uses: actions/setup-go@v5
        with:
          go-version-file: runner/cs-runner/go.mod
      - name: Package runner into daemon priv
        run: (cd runner/cs-runner && go build -o ../../daemon/priv/cs-runner .)
      - name: Build OTP release and cs client
        run: |
          mkdir -p prefix/bin prefix/libexec prefix/share/consigliere
          (cd cli && go build -o ../prefix/bin/cs ./cmd/cs && go build -o ../prefix/bin/csd ./cmd/csd)
          cp docs/cutover.md prefix/share/consigliere/cutover.md
          builtin cd daemon
          mix deps.get
          MIX_ENV=prod mix compile --warnings-as-errors
          MIX_ENV=prod mix release
          cp -R _build/prod/rel/consigliere_daemon ../prefix/libexec/consigliere_daemon
      - name: Migrate, boot, ping, doctor, restart
        env:
          CS_HOME: ${{ runner.temp }}/cs-home
          CS_RELEASE: ${{ github.workspace }}/prefix/libexec/consigliere_daemon
        run: |
          set -eu
          export PATH="/usr/bin:/bin:/usr/local/bin:${PATH:-}"
          CS="${{ github.workspace }}/prefix/bin/cs"
          CSD="${{ github.workspace }}/prefix/bin/csd"
          mkdir -p "$CS_HOME"
          REL=daemon/_build/prod/rel/consigliere_daemon/bin/consigliere_daemon
          BOOT_LOG="$CS_HOME/boot.log"

          start_daemon() {
            setsid "$REL" start >>"$BOOT_LOG" 2>&1 < /dev/null &
            echo $! >"$CS_HOME/beam.pid"
            disown || true
          }

          wait_sock() {
            i=0
            while [ "$i" -lt 30 ]; do
              if [ -S "$CS_HOME/priv.sock" ] && [ -S "$CS_HOME/api.sock" ]; then
                return 0
              fi
              i=$((i + 1))
              sleep 1
            done
            return 1
          }

          dump_boot() {
            echo "boot failed; CS_HOME:"
            ls -la "$CS_HOME" || true
            cat "$BOOT_LOG" 2>/dev/null || true
            cat "$CS_HOME/last_error.log" 2>/dev/null || true
            ps aux | grep -E '[b]eam.smp|[c]onsigliere_daemon' || true
          }

          stop_daemon() {
            pid=$(cat "$CS_HOME/beam.pid" 2>/dev/null || true)
            if [ -n "${pid:-}" ]; then
              kill "$pid" 2>/dev/null || true
              i=0
              while [ "$i" -lt 10 ]; do
                kill -0 "$pid" 2>/dev/null || break
                i=$((i + 1))
                sleep 1
              done
              kill -9 "$pid" 2>/dev/null || true
            fi
            i=0
            while [ "$i" -lt 10 ]; do
              if [ ! -S "$CS_HOME/priv.sock" ] && [ ! -S "$CS_HOME/api.sock" ]; then
                break
              fi
              i=$((i + 1))
              sleep 1
            done
            rm -f "$CS_HOME/beam.pid" "$CS_HOME/priv.sock" "$CS_HOME/api.sock" "$CS_HOME/boss.sock"
          }

          "$REL" eval "Consigliere.Release.migrate()"
          start_daemon
          if ! wait_sock; then
            dump_boot
            stop_daemon
            exit 1
          fi
          test -S "$CS_HOME/api.sock"
          "$CS" ping
          "$CS" doctor
          "$CS" health
          "$CS" version
          "$CS" --json ping | grep '"ok":true'
          "$CS" missions
          "$CS" inbox
          (cd /tmp && "$CS" ping)
          if command -v strace >/dev/null; then
            strace -f -e openat,open -o "$CS_HOME/cs.trace" "$CS" ping || true
            if grep -E 'consigliere\.db' "$CS_HOME/cs.trace"; then
              echo "cs opened sqlite"
              exit 1
            fi
          fi
          INST="${{ runner.temp }}/installed"
          cp -a "${{ github.workspace }}/prefix" "$INST"
          CS_RELEASE="$INST/libexec/consigliere_daemon" "$INST/bin/cs" ping
          "$CSD" status
          stop_daemon
          sleep 2
          if pgrep -x cs-runner >/dev/null; then
            echo "leftover cs-runner after stop"
            exit 1
          fi
          test -f "$CS_HOME/consigliere.db"
          mkdir -p "$CS_HOME/LaunchAgents"
          PLIST=$(CS_LAUNCH_AGENTS_DIR="$CS_HOME/LaunchAgents" "$CSD" install --no-load)
          grep foreground "$PLIST"
          grep ThrottleInterval "$PLIST"
          stop_daemon
          : >"$BOOT_LOG"
          start_daemon
          if ! wait_sock; then
            echo "restart failed"
            dump_boot
            stop_daemon
            exit 1
          fi
          "$CS" ping
          test -f "$CS_HOME/consigliere.db"
          stop_daemon

  # UNCONDITIONAL ON PURPOSE: no `needs: changes`, no `if:`. Any commit at all can
  # track a boss-private path or land a tracked symlink as a resolved regular file,
  # so this job must run for every change, including a docs-only one. Never move it
  # behind a lane filter.
  invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Tracked symlinks must stay symlinks
        run: |
          set -eu
          # Any file git records with mode 120000 must still be a symlink on disk.
          # consigliere tracks none today; this guards a future one from being
          # committed as a resolved regular file.
          git ls-files -s | awk '$1 == "120000" { print $4 }' >symlinks.txt
          count=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            count=$((count + 1))
            [ -L "$path" ] || { echo "::error::tracked symlink is no longer a symlink: $path"; exit 1; }
          done <symlinks.txt
          echo "verified $count tracked symlink(s)"
          rm -f symlinks.txt
      - name: Boss-private paths must not be tracked
        run: |
          set -eu
          # Mirrors .gitignore's boss-private operational home.
          tracked=$(git ls-files -- .env data state config host projects .no-mistakes)
          if [ -n "$tracked" ]; then
            echo "::error::boss-private paths are tracked in git:"
            printf '%s\n' "$tracked"
            exit 1
          fi
          echo "no boss-private paths tracked"
