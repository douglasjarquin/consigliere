name: CI

on:
  push:
    branches: [main, rewrite-in-elixer]
  pull_request:

# Least privilege: CI only reads the checkout. No job writes to the repo.
permissions:
  contents: read

# Cancel superseded runs for the same branch or PR so only the newest commit's
# checks keep running.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always-on: a skipped daemon or runner job is a false green. No path
  # filter, no lane detector, no job-level `if:`. Unknown paths run these.
  daemon:
    name: Elixir daemon
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - uses: actions/setup-go@v5
        with:
          go-version-file: runner/cs-runner/go.mod
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: MIX_ENV=test mix test

  runner:
    name: Go runner
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner/cs-runner
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: runner/cs-runner/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race -shuffle=on -count=1 ./...
      - run: go build ./...

  cli:
    name: Go cs/csd client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race -shuffle=on -count=1 ./...
      - run: go build ./cmd/cs ./cmd/csd

  smoke:
    name: Release smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - uses: actions/setup-go@v5
        with:
          go-version-file: runner/cs-runner/go.mod
      - name: Package runner into daemon priv
        run: (cd runner/cs-runner && go build -o ../../daemon/priv/cs-runner .)
      - name: Build OTP release and cs client
        run: |
          mkdir -p prefix/bin prefix/libexec prefix/share/consigliere
          (cd cli && go build -o ../prefix/bin/cs ./cmd/cs && go build -o ../prefix/bin/csd ./cmd/csd)
          cp docs/cutover.md prefix/share/consigliere/cutover.md
          builtin cd daemon
          mix deps.get
          MIX_ENV=prod mix compile --warnings-as-errors
          MIX_ENV=prod mix release
          cp -R _build/prod/rel/consigliere_daemon ../prefix/libexec/consigliere_daemon
      - name: Migrate, boot, ping, doctor, restart
        env:
          CS_HOME: ${{ runner.temp }}/cs-home
          CS_RELEASE: ${{ github.workspace }}/prefix/libexec/consigliere_daemon
        run: |
          set -eu
          export PATH="/usr/bin:/bin:/usr/local/bin:${PATH:-}"
          CS="${{ github.workspace }}/prefix/bin/cs"
          CSD="${{ github.workspace }}/prefix/bin/csd"
          mkdir -p "$CS_HOME"
          REL=daemon/_build/prod/rel/consigliere_daemon/bin/consigliere_daemon
          BOOT_LOG="$CS_HOME/boot.log"

          start_daemon() {
            # Mix release start execs the BEAM and does not return.
            # rpc stop is unusable: RELEASE_DISTRIBUTION=none.
            # setsid moves the BEAM out of the Actions step process group so
            # a boot ERROR cannot abort this script before the socket wait.
            setsid "$REL" start >>"$BOOT_LOG" 2>&1 < /dev/null &
            echo $! >"$CS_HOME/beam.pid"
            disown || true
          }

          wait_sock() {
            i=0
            while [ "$i" -lt 30 ]; do
              if [ -S "$CS_HOME/priv.sock" ] && [ -S "$CS_HOME/api.sock" ]; then
                return 0
              fi
              i=$((i + 1))
              sleep 1
            done
            return 1
          }

          dump_boot() {
            echo "boot failed; CS_HOME:"
            ls -la "$CS_HOME" || true
            echo "boot.log:"
            cat "$BOOT_LOG" 2>/dev/null || true
            echo "last_error:"
            cat "$CS_HOME/last_error.log" 2>/dev/null || true
            echo "beam.pid:"
            cat "$CS_HOME/beam.pid" 2>/dev/null || true
            ps aux | grep -E '[b]eam.smp|[c]onsigliere_daemon' || true
          }

          stop_daemon() {
            pid=$(cat "$CS_HOME/beam.pid" 2>/dev/null || true)
            if [ -n "${pid:-}" ]; then
              kill "$pid" 2>/dev/null || true
              i=0
              while [ "$i" -lt 10 ]; do
                kill -0 "$pid" 2>/dev/null || break
                i=$((i + 1))
                sleep 1
              done
              kill -9 "$pid" 2>/dev/null || true
            fi
            i=0
            while [ "$i" -lt 10 ]; do
              if [ ! -S "$CS_HOME/priv.sock" ] && [ ! -S "$CS_HOME/api.sock" ]; then
                break
              fi
              i=$((i + 1))
              sleep 1
            done
            rm -f "$CS_HOME/beam.pid" "$CS_HOME/priv.sock" "$CS_HOME/api.sock" "$CS_HOME/boss.sock"
          }

          "$REL" eval "Consigliere.Release.migrate()"
          echo "post-eval CS_HOME:"
          ls -la "$CS_HOME"

          start_daemon
          if ! wait_sock; then
            dump_boot
            stop_daemon
            exit 1
          fi
          test -S "$CS_HOME/api.sock"
          "$CS" ping
          "$CS" doctor
          "$CS" health
          "$CS" version
          "$CS" --json ping | grep '"ok":true'
          "$CS" missions
          "$CS" inbox
          (cd /tmp && "$CS" ping)
          if command -v strace >/dev/null; then
            strace -f -e openat,open -o "$CS_HOME/cs.trace" "$CS" ping || true
            if grep -E 'consigliere\.db' "$CS_HOME/cs.trace"; then
              echo "cs opened sqlite"
              exit 1
            fi
          fi
          INST="${{ runner.temp }}/installed"
          cp -a "${{ github.workspace }}/prefix" "$INST"
          CS_RELEASE="$INST/libexec/consigliere_daemon" "$INST/bin/cs" ping
          "$CSD" status
          stop_daemon
          sleep 2
          if pgrep -x cs-runner >/dev/null; then
            echo "leftover cs-runner after stop"
            exit 1
          fi
          test -f "$CS_HOME/consigliere.db"
          : >"$BOOT_LOG"
          start_daemon
          if ! wait_sock; then
            echo "restart failed"
            dump_boot
            stop_daemon
            exit 1
          fi
          "$CS" ping
          test -f "$CS_HOME/consigliere.db"
          mkdir -p "$CS_HOME/LaunchAgents"
          PLIST=$(CS_LAUNCH_AGENTS_DIR="$CS_HOME/LaunchAgents" "$CSD" install --no-load)
          grep foreground "$PLIST"
          grep ThrottleInterval "$PLIST"
          stop_daemon

  # UNCONDITIONAL ON PURPOSE: any commit can track a boss-private path or
  # land a tracked symlink as a resolved regular file.
  invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Tracked symlinks must stay symlinks
        run: |
          set -eu
          # Any file git records with mode 120000 must still be a symlink on disk.
          git ls-files -s | awk '$1 == "120000" { print $4 }' >symlinks.txt
          count=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            count=$((count + 1))
            [ -L "$path" ] || { echo "::error::tracked symlink is no longer a symlink: $path"; exit 1; }
          done <symlinks.txt
          echo "verified $count tracked symlink(s)"
          rm -f symlinks.txt
      - name: Boss-private paths must not be tracked
        run: |
          set -eu
          # Mirrors .gitignore's boss-private operational home.
          tracked=$(git ls-files -- .env data state config host projects .no-mistakes)
          if [ -n "$tracked" ]; then
            echo "::error::boss-private paths are tracked in git:"
            printf '%s\n' "$tracked"
            exit 1
          fi
          echo "no boss-private paths tracked"
